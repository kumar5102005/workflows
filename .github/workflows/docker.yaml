name: running docker container inside a job
on: 
    workflow_dispatch

jobs:
    docker:
        runs-on: ubuntu-latest
        container: 
            image: node:trixie-slim
            env:
                API_KEY: "sbgfhrwgfhs"
            ports:
                - 3000
        steps:
            - name: log node
              run: |
                node -v
                ls -a
                echo $API_KEY
            - name: container inside a step
              uses: docker://node:18.16-alpine3.17
              with:
                args: -p 2+3
              